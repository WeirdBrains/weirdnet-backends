[package]
name = "weirdnet-backends"
version = "0.4.6"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet model-node wrapper: llama.cpp server, vLLM and MLX-LM adapters, a local supervisor (swap groups, idle unload, crash backoff, drain), SSE decoding, raw infer/2 serving, and the /weirdnet-backends/node/1 protocol with signed capability records."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-backends"
documentation = "https://docs.rs/weirdnet-backends"
readme = "README.md"
keywords = ["llm", "inference", "llama-cpp", "vllm", "weirdnet"]
categories = ["asynchronous"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = []
# /weirdnet-backends/node/1 over weirdnet-net: signed capability records, Load/Unload/Drain,
# GroupUp/GroupDown and health, plus raw infer/2 through weirdnet-agent's server.
node = ["dep:weirdnet-net", "dep:weirdnet-sync", "dep:serde_bytes", "weirdnet-agent/pool", "weirdnet-agent/serve"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
futures = "0.3"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt", "net", "io-util", "fs"] }
tokio-stream = "0.1"
tracing = "0.1"
weirdnet-agent = "0.5.5"

serde_bytes = { version = "0.11", optional = true }
# GGUF headers for adapter checks; Hub, fit and downloads (adapters too) for models/1.
weirdnet-model = "0.5.3"
weirdnet-net = { version = "0.8.0", optional = true }
weirdnet-sync = { version = ">=0.5, <0.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
weirdnet-net = "0.8.0"
weirdnet-sync = ">=0.5, <0.9"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt", "rt-multi-thread", "net", "io-util", "test-util"] }

[[test]]
name = "adapters"
harness = false

[[test]]
name = "node"
harness = false
required-features = ["node"]

[package.metadata.docs.rs]
all-features = true
