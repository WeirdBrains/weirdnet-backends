name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo package --locked
      - name: test against weirdnet-sync 0.5 (oldest allowed)
        run: cargo update -p weirdnet-sync --precise 0.5.3 && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-features
      - name: test against weirdnet-sync 0.7
        run: cargo update -p weirdnet-sync --precise 0.7.1 && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-features
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked --lib
